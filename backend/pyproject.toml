[project]
name = "freelancehub-backend"
version = "0.1.0"
description = "FreelanceHub API — FastAPI + SQLAlchemy 2 + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143,<0.144",
  "uvicorn[standard]>=0.54,<0.55",
  "sqlalchemy>=2.1,<2.2",
  "alembic>=1.20,<1.21",
  "psycopg[binary]>=3.3,<3.4",
  "pydantic>=2.14,<2.15",
  "pydantic-settings>=2.15,<2.16",
  "email-validator>=2.3,<2.4",
  "pyjwt>=2.15,<2.16",
  "argon2-cffi>=25.1,<26",
  "fpdf2>=2.8,<2.9",  # invoice PDFs; pure Python, no system libraries needed in the image
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<9.2",
  "pytest-cov>=7.1,<7.2",
  "httpx2>=2.13,<2.14",  # required by starlette.testclient (httpx is deprecated there)
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<2.5",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.assets" = ["fonts/*.ttf", "fonts/*.txt"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "ASYNC"]
ignore = [
  "B008", # FastAPI's Depends() in defaults is idiomatic
  "N818", # domain errors are named after HTTP semantics (NotFound, Conflict), not *Error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "RUF001"] # asserts, dummy passwords, Cyrillic test data
"alembic/**" = ["N999"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
