# Local development stack: PostgreSQL 16 + FastAPI (hot reload).
#   cp .env.example .env
#   docker compose up --build
#   docker compose exec api pytest          # tests use a separate *_test database on the same server
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freelancehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-freelancehub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freelancehub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-freelancehub}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freelancehub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-freelancehub}_test
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
